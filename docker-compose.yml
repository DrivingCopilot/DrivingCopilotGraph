# Graph RAG용 Neo4j 로컬 개발 서버 + 일회성 적재(ingest) CLI 이미지.
#   기동:  docker compose up -d neo4j   (권한 문제 시 sudo 붙이기)
#   확인:  http://localhost:7474  (Neo4j Browser)
#   중지:  docker compose down       (데이터는 ./neo4j 볼륨에 유지됨)
#
# 접속 정보는 core/config.py 의 NEO4J_* 기본값과 맞춰져 있다.
# 비밀번호를 바꾸려면 .env 에 NEO4J_PASSWORD 를 지정한다(.env.example 참고).
#
# 적재 실행 (neo4j가 떠 있는 상태에서, LLM 추출용 Ollama는 호스트에 네이티브로 떠 있어야 함
# — scripts/02_setup_llm.sh 참고):
#   docker compose run --rm ingest /data/manual.pdf
#   docker compose run --rm ingest /data/manuals/    # 디렉터리 전체

services:
  neo4j:
    image: neo4j:5.26-community        # 5.26 = 현재 LTS
    container_name: driving-copilot-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (드라이버 접속)
    environment:
      # 사용자명은 항상 neo4j. 비밀번호만 .env 로 덮어쓸 수 있다(기본 password).
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-password}"
      NEO4J_PLUGINS: '["apoc"]'        # 그래프 유틸리티(apoc) 활성화
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - ./neo4j/data:/data             # 그래프 데이터 영속화
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
    healthcheck:
      # bolt 포트로 실제 쿼리가 되는지까지 확인
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD:-password}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  ingest:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    container_name: driving-copilot-graph-ingest
    profiles: ["tools"]   # 기본 `docker compose up`에는 포함되지 않음 — `run --rm ingest ...`로만 실행
    environment:
      NEO4J_URI: "bolt://neo4j:7687"          # 같은 compose 프로젝트라 서비스명으로 접속
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      GRAPH_LLM_MODEL: ${GRAPH_LLM_MODEL:-qwen3-vl:4b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux에서 호스트 네이티브 Ollama 접속용
    volumes:
      - ./manuals:/data:ro   # 적재할 PDF/txt 원본을 이 디렉터리에 두고 컨테이너에는 읽기 전용으로 마운트
    depends_on:
      neo4j:
        condition: service_healthy
